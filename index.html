<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your order · Meesho</title>
  <link rel="icon" type="image/png" href="assets/meesho-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><img class="brand-logo" src="assets/meesho-logo.png" alt="Meesho" width="44" height="44"><span class="brand-label">Your order</span></div>
      <span class="prototype-label">DICE 3.0 prototype</span>
    </div>
  </header>
  <main>
    <div class="page-heading">
      <p class="eyebrow">Order MS892341</p>
      <h1>Your order</h1>
      <p class="sub">Hi Priya, here’s your order from checkout to delivery.</p>
    </div>
    <div class="simulation-bar">
      <p class="simulation-label">Preview step</p>
      <nav class="steps" id="steps" aria-label="Prototype steps"></nav>
    </div>
    <div class="two customer-layout">
      <section id="v" aria-label="Current order step"></section>
      <aside class="card order-summary" id="sum" aria-label="Order summary"></aside>
    </div>
  </main>
  <footer class="site-footer"><span>Meesho · DICE 3.0</span><span>Customer order prototype</span></footer>
<script>
const N=['Checkout','WhatsApp offer','Pickup tracking','Delivery verification'];
const s={i:0,paid:0,wa:'',why:0,ivr:''};const $=i=>document.getElementById(i);
const go=i=>{s.i=i;draw()};
const OUT={1:['Rider must re-attempt delivery today.','Token stays on the order and adjusts against COD.'],2:['Pick a new time slot for the next attempt.','Token stays on the order.'],3:['Disputed attempt. The rider is flagged.','Token refunded in full.']};
const V=[
()=>`<div class="card flow-card"><p class="section-kicker">Cash on delivery</p><h2>Confirm your order</h2><p class="section-intro">Women's Kurti, size M · ₹299 cash on delivery</p><div class="payment-note"><b>₹20 now, ₹279 when it arrives</b><p>The ₹20 token is part of your ₹299 order total.</p></div>
<table class="amount-table"><caption class="sr-only">Order payment breakdown</caption><tr><td>Order amount</td><td class="r">₹299</td></tr><tr class="pay-now"><td><b>Pay now</b></td><td class="r"><b>₹20</b></td></tr><tr><td>Pay at delivery</td><td class="r">₹279</td></tr></table>
<button class="text-button" type="button" aria-expanded="${!!s.why}" ${s.why?'aria-controls="token-explanation"':''} onclick="s.why=!s.why;draw()">Why am I seeing this?<span aria-hidden="true">${s.why?'−':'+'}</span></button><div id="token-explanation">${s.why?'<p class="explanation">This ₹20 is only a token amount. It is deducted from the final amount you pay, so you pay ₹279 at delivery instead of ₹299. If you return the parcel after receiving it, the ₹20 is refunded.</p>':''}</div>
<div class="checkout-action"><button class="solid" type="button" onclick="s.paid=1;go(1)">Pay ₹20 and place order</button><p>₹20 will be deducted from your final payment.</p></div></div>`,
()=>`<div class="card flow-card"><p class="section-kicker">Order updates</p><h2>A pickup option, on WhatsApp</h2><p class="section-intro">Choose a nearby pickup point or keep home delivery.</p><div class="chat"><div class="chat-heading"><b>Meesho</b><span>WhatsApp · Order MS892341</span></div><div class="chat-body"><div class="bub"><p>Hi Priya! Your order can be picked up at <b>Ramesh General Store</b>, 400 m away.</p><ul><li>Arrives by Fri, 2 Aug</li><li>Held for 5 days</li><li>Get <b>₹5 off your next order</b> if you pick up from here.</li></ul></div>${s.wa?`<div class="bub me">${s.wa=='y'?"Yes, I'll pick up (₹5 off)":'Deliver to my door'}</div><div class="bub">${s.wa=='y'?'Done. ₹5 off added to your next order.':'Okay, we will try home delivery.'}</div>`:''}</div></div>
<div class="chat-actions">${s.wa?'<button class="solid" type="button" onclick="go(2)">Continue to tracking</button>':`<button class="solid" type="button" onclick="s.wa='y';draw()">Yes, I'll pick up (₹5 off)</button><button type="button" onclick="s.wa='d';draw()">Deliver to my door</button>`}</div></div>`,
()=>`<div class="card flow-card"><p class="section-kicker">Pickup tracking</p><h2>Your order is on its way</h2><p class="section-intro">Order #MS892341</p><ul class="tl">${[['Order confirmed','1 Aug, 10:30 AM',1],['Packed','1 Aug, 2:00 PM',1],['At local hub','2 Aug, 9:00 AM',1],['Arriving at kirana store','Today, 4:00 – 6:00 PM',1],['Ready for pickup','Pickup code: 4821',0]].map(x=>`<li class="${x[2]?'':'n'}"><span class="timeline-marker" aria-hidden="true">${x[2]?'✓':''}</span><span class="timeline-copy"><b>${x[0]}</b><small>${x[1]}</small>${!x[2]?'<span class="timeline-pending">Pending</span>':''}</span></li>`).join('')}</ul><div class="pickup-note">We'll remind you twice before the pickup window ends.</div><div class="simulation-action"><span>Preview a missed delivery</span><button type="button" onclick="go(3)">See what happens if no one comes</button></div></div>`,
()=>`<div class="card flow-card"><p class="section-kicker">Delivery verification</p><h2>Confirm what happened</h2><p class="section-intro">An automated call checks a reported delivery attempt.</p><blockquote class="call-message">“Our delivery partner reported you were unavailable.”</blockquote><p class="ivr-instruction">Choose the option you would press on the call.</p><div class="seg ivr-options">${[1,2,3].map(k=>`<button type="button" class="${s.ivr==k?'solid':''}" aria-pressed="${s.ivr==k}" onclick="s.ivr=${k};draw()"><span class="ivr-number">${k}</span><span><b>Press ${k}</b><small>${k==1?'Re-attempt delivery':k==2?'Reschedule delivery':'No delivery attempt happened'}</small></span></button>`).join('')}</div>${s.ivr?`<div class="${s.ivr==3?'okbox':'yel'}" role="status"><b>${OUT[s.ivr][0]}</b><br>${OUT[s.ivr][1]}</div>`:''}<p class="policy-note">A verified refusal, or no pickup after 2 reminders, forfeits the token and the parcel can go to Meesho Nearby.</p></div>`];
function draw(){document.title=N[s.i]+' · Meesho';$('steps').innerHTML=N.map((n,i)=>`<button type="button" class="${i==s.i?'on':''}" aria-current="${i==s.i?'step':'false'}" onclick="go(${i})"><span class="step-number">${i+1}</span>${n}</button>`).join('');$('v').innerHTML=V[s.i]();
const tok=s.ivr==3?'Refunded':s.paid?'Paid, adjusts against COD':'Not paid yet';
$('sum').innerHTML=`<h2>Order summary</h2><div class="product-summary"><img src="assets/kurti.jpg" width="88" height="112" alt="Women's off-white kurti with a blue floral print" class="product-photo"><div><h3>Women's Kurti</h3><p>Size M</p><b>₹299</b><small>Cash on delivery</small></div></div><table class="summary-table"><caption class="sr-only">Current payment and credit summary</caption><tr><td>₹20 token</td><td class="r"><b class="token-state">${tok}</b></td></tr><tr class="summary-due"><td>Due at pickup or delivery</td><td class="r"><b>${s.ivr==3?'₹299':'₹279'}</b></td></tr><tr><td>Next-order credit</td><td class="r">${s.wa=='y'?'₹5':'-'}</td></tr></table>`}
draw();
</script>
</body>
</html>
